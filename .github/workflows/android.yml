name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: tapcount-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Load private release signing credentials
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.TAPCOUNT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TAPCOUNT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAPCOUNT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TAPCOUNT_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tapcount-release.p12"
            echo "TAPCOUNT_KEYSTORE_PATH=$RUNNER_TEMP/tapcount-release.p12" >> "$GITHUB_ENV"
            echo "TAPCOUNT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "TAPCOUNT_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "TAPCOUNT_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_IS_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_IS_SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::Release signing secrets not configured. Debug artifact only; no public release."
          fi

      - name: Build permanently signed release APK
        if: env.RELEASE_IS_SIGNED == 'true' && github.event_name != 'pull_request'
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload signed release APK
        if: env.RELEASE_IS_SIGNED == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tapcount-release-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish new version to GitHub Releases
        if: env.RELEASE_IS_SIGNED == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping automatic replacement."
          else
            mkdir -p dist
            cp app/build/outputs/apk/release/app-release.apk "dist/TapCount-$TAG.apk"
            gh release create "$TAG" "dist/TapCount-$TAG.apk" \
              --target "$GITHUB_SHA" --title "TapCount $TAG" \
              --notes "Signed Android release. This release uses the private TapCount keystore configured in Actions secrets; subsequent releases with the same signing identity can update in place."
          fi

name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tapcount-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare signed release configuration
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          KEYSTORE_B64: ${{ secrets.TAPCOUNT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TAPCOUNT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAPCOUNT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TAPCOUNT_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tapcount-release.jks"
            echo "TAPCOUNT_KEYSTORE_PATH=$RUNNER_TEMP/tapcount-release.jks" >> "$GITHUB_ENV"
            echo "TAPCOUNT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "TAPCOUNT_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "TAPCOUNT_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_IS_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_IS_SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::No release signing secrets. The published debug APK is for testing and may not install over earlier versions."
          fi

      - name: Build signed release APK when configured
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && env.RELEASE_IS_SIGNED == 'true'
        run: gradle --no-daemon :app:assembleRelease

      - name: Publish first APK for a new version on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            mkdir -p dist
            if [ "$RELEASE_IS_SIGNED" = "true" ]; then
              cp app/build/outputs/apk/release/app-release.apk "dist/TapCount-$TAG.apk"
              ASSET="dist/TapCount-$TAG.apk"
              NOTES="Signed release build of TapCount."
            else
              cp app/build/outputs/apk/debug/app-debug.apk "dist/TapCount-$TAG-debug.apk"
              ASSET="dist/TapCount-$TAG-debug.apk"
              NOTES="Installable debug test build. GitHub Runner debug signatures may change between builds. Set permanent release signing secrets for upgradable production APKs."
            fi
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "TapCount $TAG" --notes "$NOTES"
          fi

      - name: Prepare APK for GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          if [ "$RELEASE_IS_SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/TapCount-$GITHUB_REF_NAME.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/TapCount-$GITHUB_REF_NAME-debug.apk"
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.apk
